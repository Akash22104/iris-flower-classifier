[theme]
base = "dark"
primaryColor = "#2563eb"
linkColor = "#38bdf8"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#16213a"
textColor = "#e2e8f0"
borderColor = "#24324f"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "small"
buttonRadius = "small"
metricValueFontSize = "2rem"
metricValueFontWeight = 700
chartCategoricalColors = ["#f59e0b", "#14b8a6", "#3b82f6", "#38bdf8", "#94a3b8"]

[theme.sidebar]
backgroundColor = "#060b16"
secondaryBackgroundColor = "#111a2e"
textColor = "#e2e8f0"
borderColor = "#1e2a44"
primaryColor = "#14b8a6"
